# ============================================================================
#  UltimateVirtualSpawner - chat messages
#
#  Colour codes: &a legacy, &#RRGGBB hex, <#RRGGBB>text</#RRGGBB> gradient.
#  PlaceholderAPI placeholders (%player_name% etc.) work when PAPI is installed.
#  Set a value to '' to silence that message completely.
# ============================================================================

PREFIX: '&8[&dSpawners&8] &r'
# false = send messages without the PREFIX above.
USE_PREFIX: true

# ── Spawner item ────────────────────────────────────────────────────────────
ITEM:
  # Lore of the spawner item. {type} = plain type name.
  SPAWNER_LORE:
    - '&7Type: &f{type}'
    - ''
    - '&ePlace to create or stack this spawner.'
    - '&7Sneak-place to place the whole stack.'

# ── Spawner actions ─────────────────────────────────────────────────────────
SPAWNER:
  SYSTEM_DISABLED: '&cThe spawner system is currently disabled.'
  NOT_FOUND: '&cThat spawner could not be found.'
  NOT_MANAGED_BLOCK: '&cThat is not a managed spawner.'
  NOT_MANAGED_ITEM: '&cThat is not a managed spawner item.'
  ALREADY_MANAGED_BLOCK: '&cThat block is already a managed spawner.'
  INVALID_ITEM_AMOUNT: '&cThat spawner item has an invalid amount.'
  AMOUNT_MUST_BE_POSITIVE: '&cThe spawner amount must be greater than zero.'
  TARGET_MUST_BE_ONLINE: '&cThat player must be online.'
  UNKNOWN_TYPE: "&cUnknown spawner type '&f{type}&c'."
  ITEM_CREATE_FAILED: '&cFailed to create the spawner item.'
  SAVE_FAILED: '&cFailed to save that spawner. Please try again.'

  GIVE_SUCCESS: '&aGave &f{amount}x {type} &ato &f{player}&a.'
  GIVE_RECEIVED: '&aYou received &f{amount}x {type}&a.'

  PLACE_SUCCESS: '&aPlaced &f{amount}x {type}&a.'
  EXCEEDS_MAX_STACK: '&cThat would exceed the max stack per block (&f{max}&c).'
  MAX_STACK_REACHED: '&cThat spawner is already at the max stack per block (&f{max}&c).'
  STACK_UPDATED: '&aSpawner stack updated to &f{amount}&a.'
  TYPE_MISMATCH: '&cYou can only stack the same spawner type onto this block.'
  HOLD_SPAWNER_ITEM: '&cHold a managed spawner item to stack.'
  NOT_OWNER: '&cYou do not own that spawner.'

  BREAK_SUCCESS: '&aPicked up &f{amount}x {type}&a.'
  BREAK_NO_PERMISSION: '&cYou do not have permission to break that spawner.'
  SILK_TOUCH_REQUIRED: '&cYou need Silk Touch to break this spawner!'
  REMOVED: '&aSpawner removed.'

  TEMPORARY_REGISTERED: '&aTemporary spawner registered.'
  TEMPORARY_REMOVED: '&aTemporary spawner removed.'
  TEMPORARY_CANNOT_STACK: '&cTemporary spawners cannot be stacked.'

  NO_ACCESS: '&cYou do not have access to that spawner.'
  LOOT_EMPTY: '&cThat loot entry is empty.'
  INVENTORY_FULL: '&cYour inventory is full.'
  COLLECT_SUCCESS: '&aCollected &f{amount}x {material}&a.'
  COLLECT_ALL_SUCCESS: '&aCollected &f{amount}&a items from this spawner.'
  COLLECT_ALL_NO_SPACE: '&cThere was no space to collect your spawner loot.'
  DROP_SUCCESS: '&aDropped &f{amount}&a stored items on the ground.'
  DROP_NO_LOOT: '&cThere is no enabled loot stored in that spawner.'

  SELL_SUCCESS: '&aSold &f{amount}&a items for &f{money}&a.'
  SELL_NO_ITEMS: '&cThere are no sellable items stored in that spawner.'
  SELL_PAYOUT_FAILED: '&cFailed to pay out the spawner loot sale.'
  SELL_DISABLED: '&cSelling is disabled or no economy plugin is installed.'

  XP_COLLECTED: '&aCollected &f{xp} &aXP points!'
  XP_EMPTY: '&cThere is no XP stored in that spawner.'
  XP_DISABLED: '&cXP collection is disabled on this server.'

  FILTER_TOGGLED: '&aToggled the filter for &f{material} &ato {status}&a.'
  FILTER_ENABLED_ALL: '&aEnabled storing for all drops on this spawner.'
  FILTER_DISABLED_ALL: '&cDisabled storing for all drops on this spawner.'
  FILTER_STATUS_ENABLED: '&aEnabled &7(Storing)'
  FILTER_STATUS_DISABLED: '&cDisabled &7(Not Storing)'

  TELEPORTED: '&aTeleported to the spawner at &f{x}, {y}, {z} &ain &f{world}&a.'
  WORLD_NOT_LOADED: "&cThat spawner's world is not currently loaded."

# ── Economy (/balance, /baltop, /pay, /eco) ─────────────────────────────────
ECONOMY:
  EXTERNAL_PROVIDER: '&cMoney is handled by &f{provider}&c on this server - use that plugin''s commands.'
  UNKNOWN_PLAYER: "&cNo account found for '&f{player}&c'."
  INSUFFICIENT_FUNDS: '&cYou do not have enough money for that.'

  BALANCE_SELF: '&7Balance: &a{balance}'
  BALANCE_OTHER: "&7Balance of &f{player}&7: &a{balance}"
  BALANCE_USAGE_CONSOLE: '&cUsage from console: /balance <player>'

  BALTOP_HEADER: '&8&m--------- &dTop Balances &7({count}) &8&m---------'
  BALTOP_ENTRY: '&7#{rank} &f{player} &8- &a{balance}'
  BALTOP_EMPTY: '&7Nobody has a balance yet.'

  PAY_USAGE: '&cUsage: /pay <player> <amount>'
  PAY_DISABLED: '&cPlayer-to-player payments are disabled on this server.'
  PAY_SELF: '&cYou cannot pay yourself.'
  PAY_TOO_SMALL: '&cThe minimum payment is &f{minimum}&c.'
  PAY_FAILED: '&cPayment failed: &f{reason}&c.'
  PAY_SENT: '&aSent &f{amount} &ato &f{player}&a. New balance: &f{balance}&a.'
  PAY_RECEIVED: '&aReceived &f{amount} &afrom &f{player}&a. New balance: &f{balance}&a.'

  ECO_FAILED: '&cThat did not work: &f{reason}&c.'
  ECO_GIVE: '&aGave &f{amount} &ato &f{player}&a. New balance: &f{balance}&a.'
  ECO_GIVE_NOTIFY: '&aYou received &f{amount}&a. New balance: &f{balance}&a.'
  ECO_TAKE: '&aTook &f{amount} &afrom &f{player}&a. New balance: &f{balance}&a.'
  ECO_TAKE_NOTIFY: '&c{amount} &7was taken from your balance. New balance: &f{balance}&7.'
  ECO_SET: "&aSet &f{player}&a's balance to &f{balance}&a."
  ECO_SET_NOTIFY: '&7Your balance was set to &f{balance}&7.'
  ECO_RESET: "&aReset &f{player}&a's balance to &f{balance}&a."
  ECO_USAGE_LINES:
    - '&8&m----------- &dEconomy &8&m-----------'
    - '&f/{label} give <player> <amount> &7- Add money'
    - '&f/{label} take <player> <amount> &7- Remove money'
    - '&f/{label} set <player> <amount> &7- Set an exact balance'
    - '&f/{label} reset <player> &7- Reset to the starting balance'

# ── Command feedback ────────────────────────────────────────────────────────
COMMAND:
  NO_PERMISSION: '&cYou do not have permission to do that.'
  PLAYER_ONLY: '&cThat sub-command can only be used by a player.'
  PLAYER_NOT_FOUND: "&cPlayer '&f{player}&c' must be online."
  INVALID_AMOUNT: '&cThe amount must be a valid positive number.'
  LOOK_AT_SPAWNER: '&cLook at a managed spawner first.'
  RELOADED: '&aConfiguration reloaded.'

  GIVE_USAGE: '&cUsage: /spawner give <player> <type> [amount]'

  SPLIT_USAGE: '&cUsage: /spawner split <amount>'
  SPLIT_HOLD_ITEM: '&cYou must be holding a managed spawner item.'
  SPLIT_TOO_SMALL: '&cThis spawner item cannot be split (amount is 1).'
  SPLIT_TOO_LARGE: '&cThe split amount must be less than the current stack size (&f{current}&c).'
  SPLIT_FAILED: '&cFailed to create the split spawner item.'
  SPLIT_SUCCESS: '&aSplit &f{amount}x &aspawners. &7Remaining in hand: &f{remaining}&7.'

  TYPES_HEADER: '&8&m--------- &dSpawner Types &7({count}) &8&m---------'
  TYPES_ENTRY: '&f{key} &7- {name} &8| &7entity: &f{entity} &8| &7drops: &f{drops}'

  INFO_LINES:
    - '&8&m----------- &bSpawner Info &8&m-----------'
    - '&7Type: &f{type}'
    - '&7Owner: &f{owner}'
    - '&7Stack: &f{stack}'
    - '&7Stored Loot: &f{stored}'
    - '&7Stored XP: &f{xp}'
    - '&7Access: &f{access}'
    - '&7Location: &f{world} {x}, {y}, {z}'

  VERSION_LINES:
    - '&8&m----------- &dUltimateVirtualSpawner &8&m-----------'
    - '&7Plugin version: &f{version}'
    - '&7Server software: &f{platform}'
    - '&7Server version: &f{server}'
    - '&7Supported range: &f{range}'
    - '&7Scheduler: &f{scheduler}'
    - '&7Managed spawners: &f{spawners}'
    - '&7Economy: &f{economy}'

  USAGE_LINES:
    - '&8&m----------- &dSpawner &8&m-----------'
    - '&f/{label} &7- Open the spawner panel'
    - '&f/{label} info &7- Inspect the spawner you are looking at'
    - '&f/{label} panel &7- Open the spawner admin panel'
    - '&f/{label} give <player> <type> [amount] &7- Give a spawner item'
    - '&f/{label} split <amount> &7- Split the held spawner item'
    - '&f/{label} types &7- List the configured spawner types'
    - '&f/{label} remove &7- Remove the spawner you are looking at'
    - '&f/{label} reload &7- Reload the configuration'
    - '&f/{label} version &7- Show version and compatibility info'
